services:
  - type: web
    name: medipass-api-aldrinjk
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: HAPI_FHIR_BASE_URL
        value: https://hapi.fhir.org/baseR4
      - key: RESPONDER_OTP_PROVIDER
        value: android-relay
      - key: SMS_RELAY_SHARED_KEY
        sync: false
      - key: PUBLIC_RESPONDER_WEB_BASE_URL
        value: https://medipass-responder-aldrinjk.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://medipass-responder-aldrinjk.onrender.com

  - type: web
    name: medipass-responder-aldrinjk
    runtime: static
    branch: develop
    buildCommand: cd apps/responder-web && npm ci && npm run build
    staticPublishPath: ./apps/responder-web/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://medipass-api-aldrinjk.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
