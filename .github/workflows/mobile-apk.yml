name: Build Patient APK

on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: https://medipass-api-aldrinjk.onrender.com
      EXPO_PUBLIC_USE_MOCKS: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk MediPass-Patient.apk

      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: medipass-patient-apk
          path: MediPass-Patient.apk
          if-no-files-found: error
