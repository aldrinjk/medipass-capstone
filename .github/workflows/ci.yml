name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -B verify

  frontend:
    name: Frontend (apps/mobile, apps/responder-web)
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Build each frontend when its package.json is present. Both current
      # MediPass frontends are initialized; detection keeps the workflow
      # resilient if one app is intentionally excluded in a future branch.
      - name: Detect initialized frontend projects
        id: detect
        shell: bash
        run: |
          test -f apps/mobile/package.json && echo "mobile=true" >> "$GITHUB_OUTPUT" || echo "mobile=false" >> "$GITHUB_OUTPUT"
          test -f apps/responder-web/package.json && echo "responder=true" >> "$GITHUB_OUTPUT" || echo "responder=false" >> "$GITHUB_OUTPUT"

      - name: apps/mobile - install, lint, test
        if: steps.detect.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: |
          npm install --legacy-peer-deps
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present

      - name: apps/mobile - production dependency audit (advisory)
        if: steps.detect.outputs.mobile == 'true'
        continue-on-error: true
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=high

      - name: apps/responder-web - install, lint, test
        if: steps.detect.outputs.responder == 'true'
        working-directory: apps/responder-web
        run: |
          npm ci
          npm run lint --if-present
          npm run build --if-present
          npm test --if-present

      - name: apps/responder-web - production dependency audit (advisory)
        if: steps.detect.outputs.responder == 'true'
        continue-on-error: true
        working-directory: apps/responder-web
        run: npm audit --omit=dev --audit-level=high

      - name: No frontend projects initialized yet
        if: steps.detect.outputs.mobile == 'false' && steps.detect.outputs.responder == 'false'
        run: echo "Skipping frontend build - apps/mobile and apps/responder-web have no package.json yet."

  android-relay:
    name: Android SMS Relay (apps/sms-relay-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure Android SDK 35 is available
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build relay debug APK
        working-directory: apps/sms-relay-android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload relay debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medipass-sms-relay-debug
          path: apps/sms-relay-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
