spring:
  datasource:
    url: jdbc:h2:mem:medipass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

medipass:
  cors:
    allowed-origins: http://localhost:5173
