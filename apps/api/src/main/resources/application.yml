spring:
  application:
    name: medipass-api
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

medipass:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  fhir:
    base-url: ${HAPI_FHIR_BASE_URL:http://localhost:8081/fhir}
  responder-verification:
    provider: ${RESPONDER_OTP_PROVIDER:dev}
    demo-code: ${RESPONDER_DEMO_OTP:123456}
    challenge-minutes: ${RESPONDER_OTP_CHALLENGE_MINUTES:5}
    session-minutes: ${RESPONDER_SESSION_MINUTES:15}
    max-attempts: ${RESPONDER_OTP_MAX_ATTEMPTS:5}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  sms-relay:
    shared-key: ${SMS_RELAY_SHARED_KEY:}
    claim-seconds: ${SMS_RELAY_CLAIM_SECONDS:45}
    max-delivery-attempts: ${SMS_RELAY_MAX_DELIVERY_ATTEMPTS:3}
